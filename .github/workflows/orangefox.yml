name: Build OrangeFox R12.1 for Mi Note 3 (jason)

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4
        with:
          path: device/xiaomi/jason

      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            aria2 bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses6 \
            libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python-is-python3
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize & Sync OrangeFox Source (fox_12.1)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p ~/OrangeFox_sync
          cd ~/OrangeFox_sync
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh --branch 12.1 --path ~/orangefox

      - name: Integrate Device Tree
        run: |
          mkdir -p ~/orangefox/device/xiaomi/
          cp -r $GITHUB_WORKSPACE/device/xiaomi/jason ~/orangefox/device/xiaomi/jason

      - name: Cache Ccache Data
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-orangefox-${{ runner.os }}-${{ hashFiles('**/vendorsetup.sh', '**/BoardConfig.mk') }}
          restore-keys: |
            ccache-orangefox-${{ runner.os }}-

      - name: Build Recovery Image & Zip
        run: |
          set +e
          cd ~/orangefox
          echo "=== Sourcing OrangeFox Build Environment ==="
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=jason
          export LC_ALL="C"
          export USE_CCACHE=1
          export CCACHE_DIR=~/.ccache
          ccache -M 10G
          source build/envsetup.sh
          if [ -f device/xiaomi/jason/vendorsetup.sh ]; then
            echo "Sourcing device vendorsetup.sh..."
            source device/xiaomi/jason/vendorsetup.sh
          fi
          set -e
          lunch fox_jason-eng || lunch twrp_jason-eng || lunch omni_jason-eng
          mka recoveryimage -j$(nproc)

      - name: Upload Recovery Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-R12.1-jason
          path: |
            ~/orangefox/out/target/product/jason/OrangeFox-*.zip
            ~/orangefox/out/target/product/jason/recovery.img
            ~/orangefox/out/target/product/jason/boot.img
